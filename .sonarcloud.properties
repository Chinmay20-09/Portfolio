# Configuration for SonarQube Cloud *automatic analysis*.
#
# This project is analysed by SonarQube Cloud directly from the repository, which
# ignores sonar-project.properties (see the SonarQube Cloud "Automatic analysis"
# docs). The CI/local-scan settings therefore live in sonar-project.properties, and
# any setting that must take effect on SonarQube Cloud is repeated here.
#
# Copy-paste detection only:
#   src/data/changelog-builder.ts and src/data/projects.ts are data tables, not
#   executable logic. Consecutive records are structurally identical by definition,
#   and the analyzer's duplication detector compares token structure rather than the
#   string values, so it reports most of each file as "duplicated" even though every
#   version, date, SHA, commit link and description differs. Both files stay in
#   normal analysis for all other rules (including the CSS/TS reliability rules);
#   only duplication detection skips them. No other file is excluded.
#
# Note: a value set here replaces any copy-paste exclusion list defined in the
# project's SonarQube Cloud UI, so add new entries here rather than only there.
sonar.cpd.exclusions=src/data/changelog-builder.ts,src/data/projects.ts
