# Sonar analysis scope.
#
# The duplicate-line figure reported for this repository was dominated by
# generated files, not by authored code: package-lock.json alone is ~5.4k lines
# of dependency manifests that repeat the same schema by design, and it scored
# ~27% duplication on its own. Excluding generated outputs is what sonar.exclusions
# is for - it does not hide authored duplication, because the authored code is
# still fully analysed and measured.
#
# Authored duplication is kept low by construction: repeated markup is generated
# from data tables (see DOWNLOAD_SPECS in src/components/catalog.ts) and repeated
# CSS declarations are grouped into single rules (see the "control geometry"
# section at the end of style.css).

# Set these two in CI or SonarCloud; they are left out here so a local scan
# cannot bind to the wrong project by accident.
# sonar.projectKey=
# sonar.organization=

sonar.projectName=kolte-dev
sonar.sourceEncoding=UTF-8

sonar.sources=index.html,style.css,src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts

# Generated or non-shipping output. None of this is authored source.
sonar.exclusions=dist/**,node_modules/**,coverage/**,dev-docs/**,.freebuff/**,.agents/**,package-lock.json,**/*.min.*,**/*.woff2

# Duplication (CPD) additionally ignores the lockfile and vendored copies, so the
# duplicated-lines metric reflects hand-written code only.
sonar.cpd.exclusions=package-lock.json,**/*.min.*,dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
